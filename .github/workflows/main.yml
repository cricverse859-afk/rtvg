name: Telegram Anime Bot (ep.py)

on:
  workflow_dispatch: # GitHub Actions tab se manually start karne ke liye
  schedule:
    - cron: '0 */5 * * *' # Har 5 ghante me auto-trigger karne ke liye (optional)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python ep.py
